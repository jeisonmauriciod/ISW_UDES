<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa 3D Demográfico de Colombia</title>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent-color: #00ff88;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        /* Paneles con Glassmorphism */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .control-group h3 {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .data-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 10px;
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .data-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-1px);
        }
        
        .data-btn.active {
            background: linear-gradient(135deg, #00ff88, #00b359);
            color: #000;
            font-weight: bold;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }
        
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 20px;
            width: 260px;
        }

        #department-info {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 15px;
            width: 280px;
        }
        
        .gradient-bar {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            margin: 10px 0;
            transition: background 0.4s ease;
        }
        
        .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        
        #tooltip {
            position: absolute;
            display: none;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--accent-color);
            color: #fff;
            font-size: 0.8rem;
            border-radius: 6px;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -120%);
            white-space: nowrap;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">CARGANDO VISUALIZACIÓN 3D...</div>
    <div id="tooltip"></div>
    
    <div id="container">
        <div id="controls" class="glass-panel">
            <div class="control-group">
                <h3>📊 Indicadores</h3>
                <div class="button-group">
                    <button class="data-btn active" data-type="poblacion">Población Total</button>
                    <button class="data-btn" data-type="hombres">Hombres</button>
                    <button class="data-btn" data-type="mujeres">Mujeres</button>
                    <button class="data-btn" data-type="ninos">Niños (0-14)</button>
                    <button class="data-btn" data-type="jovenes">Jóvenes (15-29)</button>
                    <button class="data-btn" data-type="adultos">Adultos (30-59)</button>
                    <button class="data-btn" data-type="mayores">Adultos Mayores</button>
                    <button class="data-btn" data-type="pobreza">Pobreza (%)</button>
                    <button class="data-btn" data-type="vulnerables">Vulnerables (%)</button>
                </div>
            </div>
        </div>
        
        <div id="info" class="glass-panel">
            <h3 style="margin: 0 0 8px 0; color: var(--accent-color); font-size: 0.85rem; text-transform: uppercase;">📍 Detalles</h3>
            <div id="department-info">Pasa el cursor sobre un departamento</div>
        </div>
        
        <div id="legend" class="glass-panel">
            <h3 style="margin: 0 0 5px 0; color: var(--accent-color); font-size: 0.85rem; text-transform: uppercase;">🎨 Escala</h3>
            <div style="font-size: 0.75rem; color: #cbd5e1;">Altura/Color = Valor del indicador</div>
            <div class="gradient-bar" id="colorGradient"></div>
            <div class="gradient-labels">
                <span id="minVal">Mínimo</span>
                <span id="maxVal">Máximo</span>
            </div>
        </div>
    </div>

            'Chocó': { lat: 5.6947, lon: -76.6611, poblacion: 534826, hombres: 271753, mujeres: 263073, ninos: 106965, jovenes: 133707, adultos: 213930, mayores: 80224, pobreza: 68.4, vulnerables: 61.8 },

            'Casanare': { lat: 5.3378, lon: -72.3959, poblacion: 372693, hombres: 193700, mujeres: 178993, ninos: 74539, jovenes: 93173, adultos: 149077, mayores: 55904, pobreza: 34.2, vulnerables: 26.8 },
            'Putumayo': { lat: 0.5144, lon: -76.5007, poblacion: 359681, hombres: 186025, mujeres: 173656, ninos: 71936, jovenes: 89920, adultos: 143872, mayores: 53953, pobreza: 49.6, vulnerables: 42.1 },
            'Arauca': { lat: 7.0847, lon: -70.7591, poblacion: 269896, hombres: 141545, mujeres: 128351, ninos: 53979, jovenes: 67474, adultos: 107958, mayores: 40485, pobreza: 38.7, vulnerables: 31.4 },
            'Amazonas': { lat: -1.4429, lon: -71.5724, poblacion: 83667, hombres: 44707, mujeres: 38960, ninos: 16733, jovenes: 20917, adultos: 33467, mayores: 12550, pobreza: 44.8, vulnerables: 38.6 },
            'Guainía': { lat: 2.5854, lon: -68.5247, poblacion: 48943, hombres: 25769, mujeres: 23174, ninos: 9789, jovenes: 12236, adultos: 19577, mayores: 7341, pobreza: 51.3, vulnerables: 45.2 },
            'San Andrés': { lat: 12.5847, lon: -81.7006, poblacion: 64012, hombres: 31046, mujeres: 32966, ninos: 12802, jovenes: 16003, adultos: 25605, mayores: 9602, pobreza: 35.7, vulnerables: 28.9 },
            'Guaviare': { lat: 2.5819, lon: -72.6459, poblacion: 124828, hombres: 67007, mujeres: 57821, ninos: 24966, jovenes: 31207, adultos: 49931, mayores: 18724, pobreza: 42.6, vulnerables: 36.1 },
            'Vichada': { lat: 4.4234, lon: -69.2878, poblacion: 98670, hombres: 54269, mujeres: 44401, ninos: 19734, jovenes: 24668, adultos: 39468, mayores: 14800, pobreza: 46.7, vulnerables: 39.8 },
            'Vaupés': { lat: 0.8554, lon: -70.8120, poblacion: 49395, hombres: 26727, mujeres: 22668, ninos: 9879, jovenes: 12349, adultos: 19758, mayores: 7409, pobreza: 53.9, vulnerables: 47.3 }
        };

        // Variables Globales
        let scene, camera, renderer, controls;
        let currentDataType = 'poblacion';
        let meshMap = new Map();
        let raycaster, mouse;
        let hoveredMesh = null;
        const tooltip = document.getElementById('tooltip');

        // Conversión Mercator Simplificada a Espacio 3D
        function geoTo3D(lat, lon) {
            const centerLat = 4.5;
            const centerLon = -73.5;
            const scale = 0.8;
            
            const x = (lon - centerLon) * scale;
            const z = -(lat - centerLat) * scale; 
            return { x, z };
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // OrbitControls Oficiales
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evitar bajar del plano
            controls.minDistance = 3;
            controls.maxDistance = 30;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupLights();
            createMapBase();
            createDataBars();
            setupEvents();
            updateVisualization(false);

            animate();
            document.getElementById('loading').style.display = 'none';
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            const blueLight = new THREE.PointLight(0x00aaff, 0.5, 30);
            blueLight.position.set(-10, 5, -10);
            scene.add(blueLight);
        }

        function createMapBase() {
            // Malla base interactiva
            const planeGeo = new THREE.PlaneGeometry(16, 18);
            const planeMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f172a,
                roughness: 0.8,
                metalness: 0.2
            });
            const base = new THREE.Mesh(planeGeo, planeMat);
            base.rotation.x = -Math.PI / 2;
            base.position.y = -0.01;
            base.receiveShadow = true;
            scene.add(base);

            const grid = new THREE.GridHelper(18, 36, 0x1e293b, 0x0f172a);
            grid.position.y = 0;
            scene.add(grid);
        }

        // Reutilización eficiente de geometrías y materiales
        const sharedGeometry = new THREE.CylinderGeometry(0.12, 0.12, 1, 16);
        sharedGeometry.translate(0, 0.5, 0); // Pivote en la base

        function createDataBars() {
            Object.entries(colombiaData).forEach(([department, data]) => {
                const pos = geoTo3D(data.lat, data.lon);
                
                const material = new THREE.MeshStandardMaterial({
                    roughness: 0.3,
                    metalness: 0.1
                });

                const bar = new THREE.Mesh(sharedGeometry, material);
                bar.position.set(pos.x, 0, pos.z);
                bar.castShadow = true;
                bar.receiveShadow = true;

                // Guardar metadatos directamente en el objeto de visualización
                bar.userData = { department, data, targetScaleY: 1, targetColor: new THREE.Color() };
                
                meshMap.set(department, bar);
                scene.add(bar);
            });
        }

        function getColorForValue(normalizedValue, dataType) {
            const colorSchemes = {
                poblacion: { start: 0x0284c7, end: 0x00ff88 },
                hombres: { start: 0x1e3a8a, end: 0x38bdf8 },
                mujeres: { start: 0x831843, end: 0xf472b6 },
                ninos: { start: 0x713f12, end: 0xfacc15 },
                jovenes: { start: 0x14532d, end: 0x4ade80 },
                adultos: { start: 0x7c2d12, end: 0xf97316 },
                mayores: { start: 0x581c87, end: 0xc084fc },
                pobreza: { start: 0x22c55e, end: 0xef4444 },
                vulnerables: { start: 0x06b6d4, end: 0xf43f5e }
            };

            const scheme = colorSchemes[dataType] || colorSchemes.poblacion;
            const start = new THREE.Color(scheme.start);
            const end = new THREE.Color(scheme.end);
            return start.lerp(end, normalizedValue);
        }

        function updateVisualization() {
            const values = Object.values(colombiaData).map(d => d[currentDataType]);
            const min = Math.min(...values);
            const max = Math.max(...values);

            meshMap.forEach((bar) => {
                const val = bar.userData.data[currentDataType];
                const normalized = (max === min) ? 0 : (val - min) / (max - min);
                
                // Cálculo de altura escalada (mínimo visible 0.2, máximo 6 unidades)
                bar.userData.targetScaleY = 0.2 + (normalized * 5.8);
                bar.userData.targetColor = getColorForValue(normalized, currentDataType);
            });

            updateLegend(min, max);
        }

        function updateLegend(min, max) {
            const colorGradients = {
                poblacion: 'linear-gradient(90deg, #0284c7, #00ff88)',
                hombres: 'linear-gradient(90deg, #1e3a8a, #38bdf8)',
                mujeres: 'linear-gradient(90deg, #831843, #f472b6)',
                ninos: 'linear-gradient(90deg, #713f12, #facc15)',
                jovenes: 'linear-gradient(90deg, #14532d, #4ade80)',
                adultos: 'linear-gradient(90deg, #7c2d12, #f97316)',
                mayores: 'linear-gradient(90deg, #581c87, #c084fc)',
                pobreza: 'linear-gradient(90deg, #22c55e, #ef4444)',
                vulnerables: 'linear-gradient(90deg, #06b6d4, #f43f5e)'
            };

            document.getElementById('colorGradient').style.background = colorGradients[currentDataType];
            
            const isPercent = currentDataType === 'pobreza' || currentDataType === 'vulnerables';
            document.getElementById('minVal').textContent = isPercent ? min.toFixed(1) + '%' : min.toLocaleString();
            document.getElementById('maxVal').textContent = isPercent ? max.toFixed(1) + '%' : max.toLocaleString();
        }

        function setupEvents() {
            document.querySelectorAll('.data-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.data-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDataType = btn.dataset.type;
                    updateVisualization();
                });
            });

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Actualizar Tooltip Flotante
            if (hoveredMesh) {
                tooltip.style.left = `${event.clientX}px`;
                tooltip.style.top = `${event.clientY}px`;
            }
        }

        function handleRaycast() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(meshMap.values()));

            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                if (hoveredMesh !== mesh) {
                    if (hoveredMesh) hoveredMesh.material.emissive.setHex(0x000000);
                    hoveredMesh = mesh;
                    hoveredMesh.material.emissive.setHex(0x333333);
                    
                    const { department, data } = mesh.userData;
                    tooltip.style.display = 'block';
                    tooltip.innerHTML = `<strong>${department}</strong>`;
                    
                    updateInfoPanel(department, data);
                }
            } else {
                if (hoveredMesh) {
                    hoveredMesh.material.emissive.setHex(0x000000);
                    hoveredMesh = null;
                    tooltip.style.display = 'none';
                }
            }
        }

        function updateInfoPanel(department, data) {
            const val = data[currentDataType];
            const isPercent = currentDataType === 'pobreza' || currentDataType === 'vulnerables';
            const displayVal = isPercent ? val.toFixed(1) + '%' : val.toLocaleString();

            document.getElementById('department-info').innerHTML = `
                <div style="font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 6px;">${department}</div>
                <div style="color: var(--accent-color); font-weight: 600; margin-bottom: 8px;">
                    Val. Actual: ${displayVal}
                </div>
                <div style="font-size: 0.75rem; color: #94a3b8; border-top: 1px solid var(--border-glass); padding-top: 6px;">
                    • Pob. Total: ${data.poblacion.toLocaleString()}<br>
                    • Pobreza: ${data.pobreza}%<br>
                    • Hombres: ${data.hombres.toLocaleString()} | Mujeres: ${data.mujeres.toLocaleString()}
                </div>
            `;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            handleRaycast();

            // Lerp de animación de alturas y colores para máxima fluidez
            meshMap.forEach((bar) => {
                bar.scale.y = THREE.MathUtils.lerp(bar.scale.y, bar.userData.targetScaleY, 0.1);
                bar.material.color.lerp(bar.userData.targetColor, 0.1);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
